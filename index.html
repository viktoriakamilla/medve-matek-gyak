function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function pickQuestions(perTier) {
  return TIER_ORDER.flatMap((tier) => {
    const pool = QUESTIONS.filter((q) => q.tier === tier);
    return shuffle(pool).slice(0, perTier);
  });
}

function normalize(str) {
  return str
    .normalize("NFC")
    .trim()
    .toLowerCase()
    .replace(/\s+/g, " ")
    .replace(/[.,!?]/g, "");
}

function formatTime(totalSeconds) {
  const m = Math.floor(totalSeconds / 60);
  const s = totalSeconds % 60;
  return `${m}:${s.toString().padStart(2, "0")}`;
}

function PawIcon({ state, size = 18 }) {
  // state: 'pending' | 'correct' | 'incorrect' | 'current'
  const fill =
    state === "correct" ? "#9CC168" : state === "incorrect" ? "#C4453A" : state === "current" ? "#E8A33D" : "none";
  const stroke = state === "pending" ? "#5C7A6A" : fill;
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill={fill} stroke={stroke} strokeWidth="1.4">
      <circle cx="12" cy="15.5" r="5.2" />
      <circle cx="5.5" cy="9" r="2.1" />
      <circle cx="10.2" cy="5.3" r="2.1" />
      <circle cx="15.4" cy="5.3" r="2.1" />
      <circle cx="19.3" cy="9.2" r="2.1" />
    </svg>
  );
}

}

function MedveMatekGyakorlo() {
  const [stage, setStage] = useState("start");
  const [pkg, setPkg] = useState(null);
  const [questions, setQuestions] = useState([]);
  const [index, setIndex] = useState(0);
  const [inputValue, setInputValue] = useState("");
  const [answers, setAnswers] = useState([]); // { id, given, isCorrect }
  const [feedback, setFeedback] = useState(null); // { isCorrect, explanation }
  const [secondsLeft, setSecondsLeft] = useState(0);
  const intervalRef = useRef(null);
  const inputRef = useRef(null);

  useEffect(() => {
    if (stage !== "quiz") {
      if (intervalRef.current) clearInterval(intervalRef.current);
      return;
    }
    intervalRef.current = setInterval(() => {
      setSecondsLeft((s) => {
        if (s <= 1) {
          clearInterval(intervalRef.current);
          finishQuiz(true);
          return 0;
        }
        return s - 1;
      });
    }, 1000);
    return () => clearInterval(intervalRef.current);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [stage]);

  useEffect(() => {
    if (stage === "quiz" && !feedback && inputRef.current) {
      inputRef.current.focus();
    }
  }, [stage, index, feedback]);

  function startQuiz(selectedPkg) {
    const selected = pickQuestions(selectedPkg.perTier);
    setPkg(selectedPkg);
    setQuestions(selected);
    setIndex(0);
    setAnswers([]);
    setFeedback(null);
    setInputValue("");
    setSecondsLeft(selectedPkg.minutes * 60);
    setStage("quiz");
  }

  function submitAnswer() {
    if (feedback) return;
    const q = questions[index];
    const given = inputValue;
    const isCorrect = q.accepted.some((a) => normalize(a) === normalize(given));
    setAnswers((prev) => [...prev, { id: q.id, given, isCorrect }]);
    setFeedback({ isCorrect, explanation: q.explanation });
  }

  function nextQuestion() {
    if (index + 1 >= questions.length) {
      finishQuiz(false);
      return;
    }
    setIndex((i) => i + 1);
    setInputValue("");
    setFeedback(null);
  }

  function finishQuiz(timedOut) {
    setAnswers((prev) => {
      let next = prev;
      if (timedOut && prev.length < questions.length) {
        const missing = questions.slice(prev.length).map((q) => ({ id: q.id, given: "", isCorrect: false }));
        next = [...prev, ...missing];
      }
      return next;
    });
    setStage("result");
  }

  const correctCount = answers.filter((a) => a.isCorrect).length;
  const total = questions.length;
  const pct = total > 0 ? correctCount / total : 0;

  const rank = useMemo(() => {
    if (pct >= 0.9) return { name: "Aranymedve", color: "#F3C468", colorDark: "#C98A1F", note: "Kimagasló teljesítmény, szinte minden csapdát elkerültél." };
    if (pct >= 0.7) return { name: "Ezüstmedve", color: "#DCE6DF", colorDark: "#8FA79A", note: "Nagyon szép munka, már csak néhány trükkön csúsztál el." };
    if (pct >= 0.4) return { name: "Bronzmedve", color: "#C98A56", colorDark: "#8A5A34", note: "Szilárd alapok, egy kis gyakorlással simán feljebb léphetsz." };
    return { name: "Ébredő bocs", color: "#8FAF9B", colorDark: "#4F6B5A", note: "Ez volt a bemelegítés. Nézd át a magyarázatokat, és próbáld újra!" };
  }, [pct]);

  return (
    <div style={styles.page}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700&display=swap');
        .mm-root { font-family: 'Nunito', sans-serif; }
        .mm-heading { font-family: 'Fredoka', sans-serif; }
        @keyframes medal-pop {
          0% { transform: scale(0.4) rotate(-8deg); opacity: 0; }
          100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }
        .mm-btn { transition: transform 0.12s ease, box-shadow 0.12s ease; }
        .mm-btn:hover { transform: translateY(-1px); }
        .mm-btn:active { transform: translateY(0px) scale(0.98); }
        .mm-input:focus { outline: 2px solid #E8A33D; outline-offset: 2px; }
        .mm-card-choice:focus-visible { outline: 2px solid #E8A33D; outline-offset: 2px; }
      `}</style>
      <div className="mm-root" style={styles.container}>
        {stage === "start" && <StartScreen onStart={startQuiz} />}
        {stage === "quiz" && questions.length > 0 && (
          <QuizScreen
            questions={questions}
            index={index}
            secondsLeft={secondsLeft}
            answers={answers}
            inputValue={inputValue}
            setInputValue={setInputValue}
            feedback={feedback}
            onSubmit={submitAnswer}
            onNext={nextQuestion}
            inputRef={inputRef}
          />
        )}
        {stage === "result" && (
          <ResultScreen
            rank={rank}
            correctCount={correctCount}
            total={total}
            answers={answers}
            questions={questions}
            onRestart={() => setStage("start")}
          />
        )}
      </div>
    </div>
  );
}

function StartScreen({ onStart }) {
  return (
    <div>
      <div style={{ textAlign: "center", marginBottom: 28 }}>
        <div style={styles.pawRow}>
          <PawIcon state="correct" size={22} />
          <PawIcon state="current" size={26} />
          <PawIcon state="correct" size={22} />
        </div>
        <h1 className="mm-heading" style={styles.title}>
          Medve Matek Gyakorló
        </h1>
        <p style={styles.subtitle}>
          Gondolkodtató feladatok 4. osztályosoknak, ugyanabban a szellemben, mint az igazi
          Medve Szabadtéri Matekversenyen.
        </p>
      </div>

      <div style={styles.infoCard}>
        <p style={styles.infoText}>
          Minden feladat válasza egy rövid szám vagy szó. Indoklást nem kell írni, csak a
          megoldást. A feladatok szintenként nehezednek: bronz, ezüst, majd arany.
        </p>
      </div>

      <div style={{ display: "flex", flexDirection: "column", gap: 12, marginTop: 20 }}>
        {PACKAGES.map((p) => (
          <button
            key={p.key}
            className="mm-btn mm-card-choice"
            onClick={() => onStart(p)}
            style={styles.packageButton}
          >
            <div>
              <div className="mm-heading" style={styles.packageTitle}>{p.label}</div>
              <div style={styles.packageDesc}>{p.description}</div>
            </div>
            <div style={styles.packageTime}>{p.minutes} perc</div>
          </button>
        ))}
      </div>
    </div>
  );
}

function QuizScreen({ questions, index, secondsLeft, answers, inputValue, setInputValue, feedback, onSubmit, onNext, inputRef }) {
  const q = questions[index];
  const lowTime = secondsLeft <= 30;

  return (
    <div>
      <div style={styles.quizHeader}>
        <div style={styles.pawTrail}>
          {questions.map((qq, i) => {
            let state = "pending";
            if (i < answers.length) state = answers[i].isCorrect ? "correct" : "incorrect";
            else if (i === index) state = "current";
            return <PawIcon key={qq.id} state={state} size={16} />;
          })}
        </div>
        <div style={{ ...styles.timerChip, ...(lowTime ? styles.timerChipLow : {}) }}>
          {formatTime(secondsLeft)}
        </div>
      </div>

      <div style={styles.tierRow}>
        <span style={{ ...styles.tierBadge, background: TIER_COLOR[q.tier] }}>
          {TIER_LABEL[q.tier]}
        </span>
        <span style={styles.progressText}>
          {index + 1}. / {questions.length} feladat
        </span>
      </div>

      <div style={styles.questionCard}>
        <p style={styles.questionText}>{q.prompt}</p>
      </div>

      {!feedback ? (
        <div style={{ display: "flex", gap: 10, marginTop: 18 }}>
          <input
            ref={inputRef}
            className="mm-input"
            value={inputValue}
            onChange={(e) => setInputValue(e.target.value)}
            onKeyDown={(e) => {
              if (e.key === "Enter") onSubmit();
            }}
            placeholder="A válaszod..."
            style={styles.input}
          />
          <button className="mm-btn" onClick={onSubmit} style={styles.primaryButton}>
            Beküld
          </button>
        </div>
      ) : (
        <div
          style={{
            ...styles.feedbackCard,
            borderColor: feedback.isCorrect ? "#9CC168" : "#C4453A",
          }}
        >
          <div className="mm-heading" style={{ ...styles.feedbackTitle, color: feedback.isCorrect ? "#9CC168" : "#E39289" }}>
            {feedback.isCorrect ? "Ez az, eltaláltad!" : "Ezúttal nem jött össze."}
          </div>
          <p style={styles.feedbackText}>{feedback.explanation}</p>
          <button className="mm-btn" onClick={onNext} style={styles.primaryButton}>
            {index + 1 >= questions.length ? "Eredmény megtekintése" : "Következő feladat"}
          </button>
        </div>
      )}
    </div>
  );
}

function ResultScreen({ rank, correctCount, total, answers, questions, onRestart }) {
  return (
    <div>
      <div style={{ textAlign: "center" }}>
        <RankBadge rank={rank} />
        <h2 className="mm-heading" style={styles.resultRank}>{rank.name}</h2>
        <p style={styles.resultScore}>
          {correctCount} / {total} feladat helyes
        </p>
        <p style={styles.resultNote}>{rank.note}</p>
      </div>

      <div style={{ marginTop: 26 }}>
        <h3 className="mm-heading" style={styles.reviewHeading}>Áttekintés</h3>
        <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
          {questions.map((q, i) => {
            const a = answers[i];
            return (
              <div key={q.id} style={styles.reviewRow}>
                <PawIcon state={a?.isCorrect ? "correct" : "incorrect"} size={18} />
                <div style={{ flex: 1 }}>
                  <div style={styles.reviewPrompt}>{q.prompt}</div>
                  <div style={styles.reviewMeta}>
                    A te válaszod: <strong>{a?.given ? a.given : "(nincs válasz)"}</strong>
                    {!a?.isCorrect && (
                      <>
                        {" "}
                        · Helyes: <strong>{q.accepted[0]}</strong>
                      </>
                    )}
                  </div>
                </div>
              </div>
            );
          })}
        </div>
      </div>

      <button className="mm-btn" onClick={onRestart} style={{ ...styles.primaryButton, width: "100%", marginTop: 24 }}>
        Új kör indítása
      </button>
    </div>
  );
}
